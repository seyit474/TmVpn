name: Build Telo VPN

on:
  push:
    branches: [ main, master, "claude/*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download libXray AAR
        run: |
          mkdir -p app/libs
          # Önce doğrudan URL ile dene (API rate limit sorununu atlatır)
          DIRECT_URL="https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          if curl -fsSL -o app/libs/libXray.aar "$DIRECT_URL" 2>/dev/null; then
            echo "libXray.aar indirildi (doğrudan URL)"
          else
            # GitHub API fallback
            echo "Doğrudan URL başarısız, GitHub API deneniyor..."
            API_URL=$(curl -sf "https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest" \
              | python3 -c "import sys,json; assets=json.load(sys.stdin).get('assets',[]); print(next((a['browser_download_url'] for a in assets if a['name'].endswith('.aar')), ''))" 2>/dev/null || true)
            if [ -n "$API_URL" ]; then
              curl -fsSL -o app/libs/libXray.aar "$API_URL" && echo "libXray.aar indirildi (API)" || echo "API indirme başarısız — stub mode"
            else
              echo "AAR bulunamadı — stub mode (derleme devam eder, VPN tüneli çalışmaz)"
            fi
          fi

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            artifacts/TeloVPN-debug-${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeloVPN-debug-apk
          path: artifacts/*.apk
          retention-days: 30
